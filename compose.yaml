services:
  app:
    build: .
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      # ホストの node_modules でコンテナ側を上書きしないよう名前付きボリュームに分離
      - node_modules:/app/node_modules
    environment:
      # Docker Desktop (macOS) ではファイル変更イベントが届かないためポーリングで検知
      - WATCHPACK_POLLING=true
      - BROWSER=none

  storybook:
    build: .
    # コンテナ外からアクセスできるよう 0.0.0.0 で待ち受け、コンテナ内でブラウザを開かない
    command: npm run storybook -- --host 0.0.0.0 --no-open
    ports:
      - "6006:6006"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    environment:
      - WATCHPACK_POLLING=true

volumes:
  node_modules:
