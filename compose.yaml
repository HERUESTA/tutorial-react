services:
  app:
    build: .
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      # ホストの node_modules でコンテナ側を上書きしないよう名前付きボリュームに分離
      - node_modules:/app/node_modules
    environment:
      # Docker Desktop (macOS) ではファイル変更イベントが届かないためポーリングで検知
      - WATCHPACK_POLLING=true
      - BROWSER=none

  storybook:
    build: .
    # コンテナ外からアクセスできるよう 0.0.0.0 で待ち受け、コンテナ内でブラウザを開かない
    command: npm run storybook -- --host 0.0.0.0 --no-open
    ports:
      - "6006:6006"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    environment:
      - WATCHPACK_POLLING=true

  # ビジュアルリグレッションテスト。`docker compose up` では起動させず、
  # `docker compose run --rm chromatic` で明示的に実行する
  chromatic:
    build: .
    profiles: ["chromatic"]
    command: npm run chromatic
    volumes:
      # .git もマウントされるので、Chromatic がコミット履歴を参照できる
      - .:/app
      - node_modules:/app/node_modules
    environment:
      # ホストの環境変数、またはリポジトリ直下の .env から渡す (.env.example 参照)
      - CHROMATIC_PROJECT_TOKEN=${CHROMATIC_PROJECT_TOKEN:-}

volumes:
  node_modules:
