services:
  app:
    build: .
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      # ホストの node_modules でコンテナ側を上書きしないよう名前付きボリュームに分離
      - node_modules:/app/node_modules
    environment:
      # Docker Desktop (macOS) ではファイル変更イベントが届かないためポーリングで検知
      - WATCHPACK_POLLING=true
      - BROWSER=none

volumes:
  node_modules:
